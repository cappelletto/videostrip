repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: '\.(c|cc|cpp|cxx|h|hpp)$'
        # Do not format vendored / generated code
        exclude: >
          ^(
            third_party/|
            external/|
            build/|
            .*/_deps/|
            .*/_install/|
            videostrip/.*/generated/
          )

