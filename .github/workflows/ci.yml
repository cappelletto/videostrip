name: C/C++ CI (Linux + Windows)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Release ]
    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # vcpkg cache location (Windows only)
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------- Install deps --------
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
                                  libopencv-dev \
                                  doxygen graphviz \
                                  libyaml-cpp-dev

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if (!(Test-Path -Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & $env:VCPKG_ROOT\bootstrap-vcpkg.bat
          }

      - name: vcpkg install (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & $env:VCPKG_ROOT\vcpkg.exe install opencv yaml-cpp --triplet x64-windows
          echo "VCPKG_TOOLCHAIN=${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      # -------- Configure --------
      - name: Configure (CMake)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=build/bin `
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=build/lib `
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=build/lib `
            ${{ matrix.os == 'windows-latest' && format('-DCMAKE_TOOLCHAIN_FILE={0}', env.VCPKG_TOOLCHAIN) || '' }}
        shell: pwsh

      # -------- Build --------
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -- -v

      # -------- Test --------
      - name: CTest
        working-directory: build
        run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      # -------- Upload logs on failure --------
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            build/Testing/Temporary/LastTest*.log
            build/Testing/**/Test.xml
            build/bin/**/*.log
          if-no-files-found: ignore
          retention-days: 30

      # -------- Package (CPack) --------
      - name: CPack (package binaries)
        if: (github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')
        working-directory: build
        run: |
          cpack -G ZIP
          cpack -G TGZ

      # -------- Upload artifacts on master/tags --------
      - name: Upload artifacts (Windows ZIP)
        if: (matrix.os == 'windows-latest') && ((github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: videostrip-windows-${{ env.BUILD_TYPE }}
          path: |
            build/bin/**/*.exe
            build/bin/**/*.pdb
            build/lib/**/*.lib
            build/*.zip
          retention-days: 30

      - name: Upload artifacts (Linux TGZ)
        if: (matrix.os == 'ubuntu-latest') && ((github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: videostrip-linux-${{ env.BUILD_TYPE }}
          path: |
            build/bin/videostrip_cli
            build/lib/**/*.a
            build/*.tar.gz
          retention-days: 30
